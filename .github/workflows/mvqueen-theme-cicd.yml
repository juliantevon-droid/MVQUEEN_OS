name: MVQUEEN Theme CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'storefront/theme/**'
      - '30_System_Infrastructure/automation/**'
      - '.github/workflows/mvqueen-theme-cicd.yml'
  pull_request:
    paths:
      - 'storefront/theme/**'
      - '30_System_Infrastructure/automation/**'
      - '.github/workflows/mvqueen-theme-cicd.yml'
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: mvqueen-theme-${{ github.ref }}
  cancel-in-progress: true

env:
  # Canonical non-secret deployment identity, verified against the connected Shopify store.
  SHOPIFY_STORE: tsucu0-1i.myshopify.com
  SHOPIFY_THEME_ID: '154876772550'
  EXPECTED_SHOPIFY_STORE: tsucu0-1i.myshopify.com
  EXPECTED_SHOPIFY_THEME_ID: '154876772550'

jobs:
  validate:
    name: Validate storefront contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install Shopify CLI
        run: npm install -g @shopify/cli
      - name: Validate MVQUEEN control registry
        run: python 30_System_Infrastructure/automation/validate_control_registry.py
      - name: Run MVQUEEN contract validator
        run: python 30_System_Infrastructure/automation/validate_theme_contract.py
      - name: Run storefront release audit
        run: python 30_System_Infrastructure/automation/storefront_release_audit.py
      - name: Run Shopify Theme Check
        run: shopify theme check --path storefront/theme --fail-level error --output text
      - name: Save validation logs
        if: always()
        run: |
          mkdir -p .mvqueen-ci
          shopify version > .mvqueen-ci/shopify-version.txt 2>&1 || true
          git rev-parse HEAD > .mvqueen-ci/commit.txt
          cp build/storefront_release_audit/report.json .mvqueen-ci/storefront-release-audit.json 2>/dev/null || true
          cp build/storefront_release_audit/report.md .mvqueen-ci/storefront-release-audit.md 2>/dev/null || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mvqueen-theme-validation-${{ github.run_id }}
          path: .mvqueen-ci
          retention-days: 14
          include-hidden-files: true

  deployment-gate:
    name: Deployment configuration gate
    needs: validate
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Verify deployment identity configuration
        env:
          DEPLOY_ENABLED: 'true'
        run: |
          if [ "$DEPLOY_ENABLED" = "true" ]; then
            if [ -z "$SHOPIFY_STORE" ] || [ -z "$SHOPIFY_THEME_ID" ]; then
              echo 'Deployment is enabled but Shopify store/theme identity is missing.'
              echo 'Canonical Shopify store/theme identity is missing from the workflow.'
              exit 1
            fi
            if [ "$SHOPIFY_STORE" != "$EXPECTED_SHOPIFY_STORE" ]; then
              echo "Configured Shopify store does not match the canonical MVQUEEN store: $EXPECTED_SHOPIFY_STORE"
              exit 1
            fi
            if [ "$SHOPIFY_THEME_ID" != "$EXPECTED_SHOPIFY_THEME_ID" ]; then
              echo "Configured Shopify theme ID does not match the verified MVQueen Release Candidate theme: $EXPECTED_SHOPIFY_THEME_ID"
              exit 1
            fi
            echo 'Deployment enabled with verified canonical Shopify store/theme identity.'
          else
            echo 'Staging deployment is disabled.'
            echo 'Validation still runs automatically; no Shopify write is attempted.'
          fi

  deploy-unpublished:
    name: Deploy to MVQUEEN unpublished theme
    needs: [validate, deployment-gate]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install Shopify CLI
        run: npm install -g @shopify/cli
      - name: Verify target theme is not live
        env:
          SHOPIFY_CLI_THEME_TOKEN: ${{ secrets.SHOPIFY_CLI_THEME_TOKEN }}
        run: |
          if [ -z "$SHOPIFY_CLI_THEME_TOKEN" ]; then
            echo 'SHOPIFY_CLI_THEME_TOKEN is required when MVQUEEN_DEPLOY_ENABLED=true.'
            exit 1
          fi
          shopify theme list --json --store "$SHOPIFY_STORE" --password "$SHOPIFY_CLI_THEME_TOKEN" > theme-list.json
          python 30_System_Infrastructure/automation/verify_unpublished_theme.py theme-list.json
      - name: Push validated source without deleting remote base files
        env:
          SHOPIFY_CLI_THEME_TOKEN: ${{ secrets.SHOPIFY_CLI_THEME_TOKEN }}
        run: |
          files=(layout/theme.liquid config/settings_schema.json locales/en.default.json locales/es.json locales/fr.json locales/pt-BR.json assets/mvqueen.css assets/mvqueen-design-system.css assets/mvqueen-header.css assets/mvqueen-product.css assets/brand-gateway.css assets/mvqueen-analytics.js assets/mvqueen.js assets/mvqueen-ux.js sections/announcement-bar.liquid sections/header.liquid sections/brand-gateway.liquid sections/hero.liquid sections/editorial-curation.liquid sections/footer.liquid sections/trust-strip.liquid sections/featured-products.liquid sections/brand-pillars.liquid sections/brand-story.liquid sections/house-story.liquid sections/social-media.liquid sections/social-proof.liquid sections/trust-badges.liquid sections/newsletter.liquid sections/brand-gateway.liquid sections/miss-princess-experience.liquid sections/main-product.liquid sections/main-collection.liquid sections/main-search.liquid sections/main-cart.liquid sections/product-recommendations.liquid sections/main-page.liquid sections/contact-page.liquid sections/editorial-hub.liquid sections/lookbook.liquid snippets/product-card.liquid snippets/breadcrumbs.liquid snippets/product-schema.liquid snippets/seo-meta.liquid snippets/trust-badges.liquid templates/index.json templates/product.json templates/collection.json templates/search.json templates/cart.json templates/page.mvqueen.json templates/page.miss-princess.json templates/page.contact.json templates/page.about.json templates/page.faq.json templates/page.journal.json templates/page.lookbook.json)
          files+=(sections/mvq-before-after.liquid sections/mvq-blog-posts.liquid sections/mvq-collapsible-tabs.liquid sections/mvq-custom-content.liquid sections/mvq-featured-collections.liquid sections/mvq-image-overlay.liquid sections/mvq-parallax.liquid sections/mvq-product-showcase.liquid sections/mvq-product-slider.liquid sections/mvq-product-tabs.liquid sections/mvq-slideshow.liquid sections/mvq-testimonials.liquid snippets/mvq-carousel-controls.liquid snippets/mvq-section-heading.liquid snippets/mvq-section-image.liquid snippets/mvq-section-kit.liquid snippets/mvq-parallax-panel.liquid)
          args=()
          for f in "${files[@]}"; do args+=(--only "$f"); done
          shopify theme push --path storefront/theme --json --strict --nodelete --theme "$SHOPIFY_THEME_ID" --store "$SHOPIFY_STORE" --password "$SHOPIFY_CLI_THEME_TOKEN" "${args[@]}"
      - name: Re-verify target remains unpublished after deployment
        env:
          SHOPIFY_CLI_THEME_TOKEN: ${{ secrets.SHOPIFY_CLI_THEME_TOKEN }}
        run: |
          shopify theme list --json --store "$SHOPIFY_STORE" --password "$SHOPIFY_CLI_THEME_TOKEN" > theme-list-after-push.json
          python 30_System_Infrastructure/automation/verify_unpublished_theme.py theme-list-after-push.json
      - name: Record deployment evidence
        if: always()
        run: |
          mkdir -p .mvqueen-ci
          printf 'store=%s\ntheme=%s\ncommit=%s\nrun=%s\n' "$SHOPIFY_STORE" "$SHOPIFY_THEME_ID" "$GITHUB_SHA" "$GITHUB_RUN_ID" > .mvqueen-ci/deployment.txt
          cp theme-list-after-push.json .mvqueen-ci/theme-list-after-push.json 2>/dev/null || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mvqueen-theme-deployment-${{ github.run_id }}
          path: .mvqueen-ci
          retention-days: 30
          include-hidden-files: true


  release-candidate-lighthouse:
    name: Release Candidate Lighthouse gate
    needs: deploy-unpublished
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Run Lighthouse against unpublished Release Candidate
        env:
          TARGET_URL: https://tsucu0-1i.myshopify.com/?preview_theme_id=154876772550
        run: |
          npx -y lighthouse@12 "$TARGET_URL" \
            --quiet \
            --chrome-flags="--headless --no-sandbox" \
            --output=json \
            --output-path=release-candidate-lighthouse.json
      - name: Enforce Release Candidate Lighthouse budgets
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('release-candidate-lighthouse.json', 'utf8'));
          const budget = JSON.parse(fs.readFileSync('30_System_Infrastructure/system/registry/performance_budget.json', 'utf8')).lighthouse;
          const checks = {
            performance: 'performance',
            accessibility: 'accessibility',
            bestPractices: 'best-practices',
            seo: 'seo',
          };
          let failed = false;
          for (const [budgetKey, categoryKey] of Object.entries(checks)) {
            const score = report.categories[categoryKey].score;
            console.log(budgetKey + ': ' + score);
            if (score < budget[budgetKey]) failed = true;
          }
          console.log('Release Candidate requested URL: ' + report.requestedUrl);
          console.log('Release Candidate final URL: ' + report.finalUrl);
          for (const id of [
            'errors-in-console',
            'third-party-cookies',
            'largest-contentful-paint-element',
            'render-blocking-resources',
            'uses-responsive-images',
            'image-delivery-insight',
            'lcp-discovery-insight',
            'unused-javascript',
            'mainthread-work-breakdown'
          ]) {
            const audit = report.audits[id];
            if (!audit) continue;
            console.log('Diagnostic ' + id + ': ' + JSON.stringify({
              score: audit.score,
              title: audit.title,
              displayValue: audit.displayValue,
              details: audit.details?.items?.slice?.(0, 10) ?? audit.details ?? null,
            }));
          }
          const categoryAuditIds = new Set(
            Object.values(report.categories)
              .flatMap((category) => (category.auditRefs ?? []).map((ref) => ref.id))
          );
          const actionable = Object.entries(report.audits)
            .filter(([id, audit]) =>
              categoryAuditIds.has(id) &&
              typeof audit.score === 'number' &&
              audit.score < 1 &&
              !['notApplicable', 'manual'].includes(audit.scoreDisplayMode)
            )
            .map(([id, audit]) => ({
              id,
              score: audit.score,
              title: audit.title,
              displayValue: audit.displayValue ?? '',
            }))
            .sort((a, b) => a.score - b.score);
          console.log('Actionable Release Candidate Lighthouse audits:');
          for (const audit of actionable) {
            console.log('- [' + audit.score + '] ' + audit.id + ': ' + audit.title + ' ' + audit.displayValue);
          }
          if (failed) process.exit(1);
          NODE
      - name: Save Release Candidate Lighthouse artifact
        if: always()
        run: |
          mkdir -p .mvqueen-ci
          cp release-candidate-lighthouse.json .mvqueen-ci/release-candidate-lighthouse.json 2>/dev/null || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mvqueen-release-candidate-lighthouse-${{ github.run_id }}
          path: .mvqueen-ci
          retention-days: 14
          include-hidden-files: true

# Canonical deployment identity remains pinned to MVQueen — Release Candidate; validated theme changes on main deploy automatically to this unpublished target. Scheduled runs validate only. settings_data and backup/rollback themes are never automated deployment targets.
