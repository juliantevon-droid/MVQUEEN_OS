name: MVQUEEN Storefront Performance

on:
  push:
    branches: [main]
    paths:
      - 'storefront/theme/**'
      - '30_System_Infrastructure/automation/storefront_performance_audit.py'
      - '30_System_Infrastructure/system/registry/performance_budget.json'
      - 'app/config/mvqueen-control-registry.json'
      - '30_System_Infrastructure/system/registry/enterprise_capabilities.json'
      - '.github/workflows/storefront-performance.yml'
  pull_request:
    branches: [main]
  schedule:
    - cron: '29 8 * * 2'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-budget:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Validate MVQUEEN control registry
        run: python 30_System_Infrastructure/automation/validate_control_registry.py
      - name: Enforce theme asset budgets
        run: python 30_System_Infrastructure/automation/storefront_performance_audit.py

  lighthouse:
    if: github.event_name != 'pull_request' && vars.MVQUEEN_STOREFRONT_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET_URL: ${{ vars.MVQUEEN_STOREFRONT_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.16.0'
      - name: Run Lighthouse
        run: npx -y lighthouse@12 "$TARGET_URL" --quiet --chrome-flags="--headless --no-sandbox" --output=json --output-path=lighthouse.json
      - name: Enforce Lighthouse budgets
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('lighthouse.json', 'utf8'));
          const budgetConfig = JSON.parse(fs.readFileSync('30_System_Infrastructure/system/registry/performance_budget.json', 'utf8'));
          const target = budgetConfig.lighthouse;
          const gate = budgetConfig.liveReleaseGate;
          const checks = {performance:'performance',accessibility:'accessibility',bestPractices:'best-practices',seo:'seo'};
          let failed = false;
          for (const [budgetKey, categoryKey] of Object.entries(checks)) {
            const score = report.categories[categoryKey].score;
            console.log(`${budgetKey}: ${score} (enterprise target ${target[budgetKey]}, release floor ${gate[budgetKey]})`);
            if (score < target[budgetKey]) {
              console.log(`::warning::${budgetKey} is below the MVQUEEN enterprise target; target is retained and not downgraded.`);
            }
            if (score < gate[budgetKey]) failed = true;
          }
          for (const [auditId, minimum] of Object.entries(gate.requiredAuditScores ?? {})) {
            const score = report.audits[auditId]?.score;
            console.log(`requiredAudit ${auditId}: ${score} (minimum ${minimum})`);
            if (typeof score !== 'number' || score < minimum) failed = true;
          }
          console.log('Documented platform overhead: ' + (gate.documentedPlatformOverhead ?? []).join(' | '));
          console.log(`Lighthouse requested URL: ${report.requestedUrl}`);
          console.log(`Lighthouse final URL: ${report.finalUrl}`);
          for (const id of [
            'errors-in-console',
            'target-size',
            'meta-description',
            'redirects',
            'third-party-cookies',
            'inspector-issues',
            'deprecations',
            'csp-xss',
            'no-vulnerable-libraries',
            'largest-contentful-paint-element',
            'render-blocking-resources',
            'uses-responsive-images',
            'image-delivery-insight',
            'lcp-discovery-insight',
            'unused-javascript',
            'mainthread-work-breakdown'
          ]) {
            const audit = report.audits[id];
            if (!audit) continue;
            console.log(`Diagnostic ${id}: ${JSON.stringify({
              score: audit.score,
              title: audit.title,
              displayValue: audit.displayValue,
              details: audit.details?.items?.slice?.(0, 10) ?? audit.details ?? null,
            })}`);
          }
          const categoryAuditIds = new Set(
            Object.values(report.categories)
              .flatMap((category) => (category.auditRefs ?? []).map((ref) => ref.id))
          );
          const actionable = Object.entries(report.audits)
            .filter(([id, audit]) =>
              categoryAuditIds.has(id) &&
              typeof audit.score === 'number' &&
              audit.score < 1 &&
              !['notApplicable', 'manual'].includes(audit.scoreDisplayMode)
            )
            .map(([id, audit]) => ({
              id,
              score: audit.score,
              title: audit.title,
              displayValue: audit.displayValue ?? '',
            }))
            .sort((a, b) => a.score - b.score);
          console.log('Actionable Lighthouse audits:');
          for (const audit of actionable) {
            console.log(`- [${audit.score}] ${audit.id}: ${audit.title} ${audit.displayValue}`);
          }
          if (failed) process.exit(1);
          NODE
