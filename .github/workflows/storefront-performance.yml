name: MVQUEEN Storefront Performance

on:
  push:
    branches: [main]
    paths:
      - 'storefront/theme/**'
      - '30_System_Infrastructure/automation/storefront_performance_audit.py'
      - '30_System_Infrastructure/automation/lighthouse_median_gate.mjs'
      - '30_System_Infrastructure/system/registry/performance_budget.json'
      - 'app/config/mvqueen-control-registry.json'
      - '30_System_Infrastructure/system/registry/enterprise_capabilities.json'
      - '.github/workflows/storefront-performance.yml'
  pull_request:
    branches: [main]
  schedule:
    - cron: '29 8 * * 2'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-budget:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Validate MVQUEEN control registry
        run: python 30_System_Infrastructure/automation/validate_control_registry.py
      - name: Enforce theme asset budgets
        run: python 30_System_Infrastructure/automation/storefront_performance_audit.py

  lighthouse:
    if: github.event_name != 'pull_request' && vars.MVQUEEN_STOREFRONT_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET_URL: ${{ vars.MVQUEEN_STOREFRONT_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.16.0'
      - name: Run Lighthouse sample
        run: |
          for run in 1 2 3; do
            echo "Lighthouse live sample $run/3"
            npx -y lighthouse@12 "$TARGET_URL" \
              --quiet \
              --chrome-flags="--headless --no-sandbox" \
              --output=json \
              --output-path="lighthouse-$run.json"
          done
      - name: Enforce median Lighthouse budgets
        run: |
          node 30_System_Infrastructure/automation/lighthouse_median_gate.mjs \
            live lighthouse-1.json lighthouse-2.json lighthouse-3.json
      - name: Save live Lighthouse report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mvqueen-live-lighthouse-${{ github.run_id }}
          path: lighthouse-*.json
          retention-days: 14
