name: One-time MVQueen brand case normalization

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-time-mvqueen-brand-case.yml"

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize standalone brand display spelling
        shell: python
        run: |
          import pathlib
          import re
          import subprocess

          allowed_suffixes = {
              ".md", ".py", ".json", ".liquid", ".css", ".js", ".ts", ".tsx",
              ".yml", ".yaml", ".toml", ".txt", ".html", ".csv", ".sql",
              ".prisma", ".sh", ".example", ".gitignore"
          }
          special_names = {".env.example", ".gitignore"}
          pattern = re.compile(rb"(?<![A-Za-z0-9_/-])MVQUEEN(?![A-Za-z0-9_/-])")

          tracked = subprocess.check_output(["git", "ls-files", "-z"]).split(b"\0")
          changed_files = 0
          replacements = 0

          for raw in tracked:
              if not raw:
                  continue
              path = pathlib.Path(raw.decode("utf-8"))
              if path.name not in special_names and path.suffix.lower() not in allowed_suffixes:
                  continue
              data = path.read_bytes()
              new_data, count = pattern.subn(b"MVQueen", data)
              if count:
                  path.write_bytes(new_data)
                  changed_files += 1
                  replacements += count

          print(f"Changed files: {changed_files}")
          print(f"Replacements: {replacements}")
          pathlib.Path("/tmp/mvqueen_brand_case_result.txt").write_text(
              f"changed_files={changed_files}\nreplacements={replacements}\n",
              encoding="utf-8",
          )

      - name: Validate diff
        run: |
          git diff --check
          cat /tmp/mvqueen_brand_case_result.txt

      - name: Commit normalized brand spelling
        run: |
          if git diff --quiet; then
            echo "No brand spelling changes were required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "standardize MVQueen brand casing across repository"
          git push origin HEAD:main
