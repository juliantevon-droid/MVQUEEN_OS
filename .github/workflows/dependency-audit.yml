name: MVQUEEN Dependency Audit

on:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/dependency-audit.yml'
  schedule:
    - cron: '11 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.16.0'
      - name: Resolve dependency lock for audit
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install resolved dependency tree
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify patched deepmerge-ts resolution
        run: npm ls deepmerge-ts

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Report outdated dependencies without creating branches
        run: npm outdated || true
