name: MVQUEEN Backend Tests

on:
  push:
    branches:
      - feature/mvqueen-shopify-backend-v3
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile backend
        run: python -m compileall apps/mvqueen-shopify-backend 15_Scripts_And_Code/mvqueen_engine
      - name: Run backend safety tests
        working-directory: apps/mvqueen-shopify-backend
        run: PYTHONPATH=. python -m unittest -v test_backend_safety.py
