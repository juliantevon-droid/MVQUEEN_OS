name: MVQUEEN Runtime Health Monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mvqueen-runtime-health
  cancel-in-progress: true

jobs:
  health-monitor:
    name: Verify Railway app and durable worker health
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      MVQ_HEALTH_URL: https://mvqueen-web-production.up.railway.app/healthz
    steps:
      - name: Check production health endpoint
        shell: bash
        run: |
          set -euo pipefail
          case "$MVQ_HEALTH_URL" in
            https://*) ;;
            *)
              echo "MVQ_HEALTH_URL must be HTTPS."
              exit 1
              ;;
          esac

          body="$(mktemp)"
          code="$(
            curl               --silent               --show-error               --location               --max-time 30               --retry 2               --retry-all-errors               --output "$body"               --write-out '%{http_code}'               "$MVQ_HEALTH_URL"
          )"

          cat "$body"
          echo

          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            echo "Production health endpoint returned HTTP $code."
            exit 1
          fi

          echo "Railway app health endpoint is responding successfully."
          echo "The continuously running Railway product worker owns queue draining and reconciliation."
