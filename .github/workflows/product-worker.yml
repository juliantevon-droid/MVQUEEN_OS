name: MVQUEEN Always-On Product Worker

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mvqueen-product-worker
  cancel-in-progress: false

jobs:
  run-product-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      MVQ_PRODUCT_WORKER_URL: ${{ secrets.MVQ_PRODUCT_WORKER_URL }}
      MVQ_PRODUCT_WORKER_TOKEN: ${{ secrets.MVQ_PRODUCT_WORKER_TOKEN }}
    steps:
      - name: Drain product queue and reconcile missed events
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${MVQ_PRODUCT_WORKER_URL:-}" ] || [ -z "${MVQ_PRODUCT_WORKER_TOKEN:-}" ]; then
            echo "Always-on worker secrets are not configured; skipping without exposing secret values."
            exit 0
          fi

          case "$MVQ_PRODUCT_WORKER_URL" in
            https://*) ;;
            *)
              echo "MVQ_PRODUCT_WORKER_URL must be HTTPS."
              exit 1
              ;;
          esac

          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --max-time 180 \
            --retry 2 \
            --retry-all-errors \
            --request POST \
            --header "Authorization: Bearer ${MVQ_PRODUCT_WORKER_TOKEN}" \
            "$MVQ_PRODUCT_WORKER_URL"
