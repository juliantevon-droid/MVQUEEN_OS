name: MVQUEEN Drive Intake Validation

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mvqueen-drive-intake
  cancel-in-progress: true

jobs:
  validate:
    name: Validate configured Drive intake
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Check Drive bridge configuration
        id: config
        env:
          RCLONE_CONFIG_B64: ${{ secrets.RCLONE_CONFIG_B64 }}
          DRIVE_SOURCE: ${{ vars.MVQUEEN_DRIVE_SOURCE }}
        run: |
          if [ -z "$RCLONE_CONFIG_B64" ] || [ -z "$DRIVE_SOURCE" ]; then
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo 'Drive intake is not configured; safe no-op.'
          else
            echo 'configured=true' >> "$GITHUB_OUTPUT"
            echo 'Drive intake configuration detected.'
          fi

      - name: Install rclone
        if: steps.config.outputs.configured == 'true'
        run: curl -fsSL https://rclone.org/install.sh | sudo bash

      - name: Pull Drive intake into temporary build workspace
        if: steps.config.outputs.configured == 'true'
        env:
          RCLONE_CONFIG_B64: ${{ secrets.RCLONE_CONFIG_B64 }}
          DRIVE_SOURCE: ${{ vars.MVQUEEN_DRIVE_SOURCE }}
        run: |
          mkdir -p "$RUNNER_TEMP/rclone" build/drive_inbox
          printf '%s' "$RCLONE_CONFIG_B64" | base64 --decode > "$RUNNER_TEMP/rclone/rclone.conf"
          RCLONE_CONFIG="$RUNNER_TEMP/rclone/rclone.conf" rclone copy "$DRIVE_SOURCE" build/drive_inbox             --config "$RUNNER_TEMP/rclone/rclone.conf"             --exclude '.git/**' --exclude '**/.git/**' --exclude '**/.env*'             --exclude '**/*secret*' --exclude '**/*token*' --exclude '**/*password*'             --exclude '**/*.pem' --exclude '**/*.key' --exclude '**/credentials*.json'             --exclude '**/service-account*.json' --exclude '**/*.apk' --exclude '**/*.exe'             --exclude '**/*.zip' --exclude '**/*.tar*' --exclude '**/*.iso'             --checksum --fast-list

      - name: Validate intake
        if: steps.config.outputs.configured == 'true'
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          root=Path('build/drive_inbox')
          bad=[]
          allowed={'.md','.txt','.json','.csv','.liquid','.css','.js','.html'}
          for p in root.rglob('*'):
              if p.is_file():
                  if p.suffix.lower() not in allowed:
                      bad.append(str(p))
                  if p.stat().st_size > 5_000_000:
                      bad.append(f'{p} (over 5MB)')
                  if p.suffix.lower()=='.json':
                      try:
                          json.loads(p.read_text(encoding='utf-8'))
                      except Exception as e:
                          bad.append(f'{p} invalid JSON: {e}')
          if bad:
              print('\n'.join(bad))
              raise SystemExit(1)
          print('Drive intake contract passed.')
          PY

      - name: Upload validated intake for manual review
        if: steps.config.outputs.configured == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: mvqueen-drive-intake-${{ github.run_id }}
          path: build/drive_inbox/
          if-no-files-found: ignore
          retention-days: 7

      - name: Confirm source-of-truth boundary
        run: |
          echo 'GitHub main remains canonical.'
          echo 'This workflow never commits or pushes Drive content.'
