name: MVQUEEN Phone → Drive → GitHub Bridge

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mvqueen-drive-bridge
  cancel-in-progress: true

jobs:
  sync:
    name: Pull approved Drive workspace into GitHub
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Check Drive bridge configuration
        env:
          RCLONE_CONFIG_B64: ${{ secrets.RCLONE_CONFIG_B64 }}
          DRIVE_SOURCE: ${{ vars.MVQUEEN_DRIVE_SOURCE }}
        run: |
          if [ -z "$RCLONE_CONFIG_B64" ] || [ -z "$DRIVE_SOURCE" ]; then
            echo 'Drive bridge is not configured yet.'
            echo 'Required secret: RCLONE_CONFIG_B64'
            echo 'Required variable: MVQUEEN_DRIVE_SOURCE'
            exit 0
          fi

      - name: Install rclone
        if: ${{ secrets.RCLONE_CONFIG_B64 != '' && vars.MVQUEEN_DRIVE_SOURCE != '' }}
        run: curl -fsSL https://rclone.org/install.sh | sudo bash

      - name: Pull Drive changes into a controlled inbox
        if: ${{ secrets.RCLONE_CONFIG_B64 != '' && vars.MVQUEEN_DRIVE_SOURCE != '' }}
        env:
          RCLONE_CONFIG_B64: ${{ secrets.RCLONE_CONFIG_B64 }}
          DRIVE_SOURCE: ${{ vars.MVQUEEN_DRIVE_SOURCE }}
        run: |
          mkdir -p "$RUNNER_TEMP/rclone" 12_Content_Assets/drive_inbox
          printf '%s' "$RCLONE_CONFIG_B64" | base64 --decode > "$RUNNER_TEMP/rclone/rclone.conf"
          RCLONE_CONFIG="$RUNNER_TEMP/rclone/rclone.conf" rclone copy "$DRIVE_SOURCE" 12_Content_Assets/drive_inbox \
            --config "$RUNNER_TEMP/rclone/rclone.conf" \
            --exclude '.git/**' \
            --exclude '**/.git/**' \
            --exclude '**/.env*' \
            --exclude '**/*secret*' \
            --exclude '**/*token*' \
            --exclude '**/*password*' \
            --exclude '**/*.pem' \
            --exclude '**/*.key' \
            --exclude '**/credentials*.json' \
            --exclude '**/service-account*.json' \
            --exclude '**/*.apk' \
            --exclude '**/*.exe' \
            --exclude '**/*.zip' \
            --exclude '**/*.tar*' \
            --exclude '**/*.iso' \
            --checksum --fast-list

      - name: Validate inbox before commit
        if: ${{ secrets.RCLONE_CONFIG_B64 != '' && vars.MVQUEEN_DRIVE_SOURCE != '' }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          root=Path('12_Content_Assets/drive_inbox')
          bad=[]
          allowed={'.md','.txt','.json','.csv','.liquid','.css','.js','.html'}
          for p in root.rglob('*'):
              if p.is_file():
                  if p.suffix.lower() not in allowed:
                      bad.append(str(p))
                  if p.stat().st_size > 5_000_000:
                      bad.append(f'{p} (over 5MB)')
                  if p.suffix.lower()=='.json':
                      try: json.loads(p.read_text(encoding='utf-8'))
                      except Exception as e: bad.append(f'{p} invalid JSON: {e}')
          if bad:
              print('\n'.join(bad))
              raise SystemExit(1)
          print('Drive inbox contract passed.')
          PY

      - name: Commit Drive changes
        if: ${{ secrets.RCLONE_CONFIG_B64 != '' && vars.MVQUEEN_DRIVE_SOURCE != '' }}
        run: |
          git config user.name 'mvqueen-automation[bot]'
          git config user.email 'mvqueen-automation@users.noreply.github.com'
          git add 12_Content_Assets/drive_inbox
          if git diff --cached --quiet; then
            echo 'No Drive changes to commit.'
            exit 0
          fi
          git commit -m 'automation: sync approved Drive workspace'
          git push origin HEAD:main
