name: MVQUEEN Source Security Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 6 * * 3'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Scan tracked source for high-confidence secrets
        run: python 30_System_Infrastructure/automation/security_scan.py
