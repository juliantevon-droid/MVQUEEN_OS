name: MVQUEEN Shopify App CI

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'prisma/**'
      - 'package.json'
      - 'tsconfig.json'
      - 'vite.config.*'
      - 'react-router.config.*'
      - 'shopify.app.toml'
      - 'shopify.web.toml'
      - '.github/workflows/shopify-app-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'prisma/**'
      - 'package.json'
      - 'tsconfig.json'
      - 'vite.config.*'
      - 'react-router.config.*'
      - 'shopify.app.toml'
      - 'shopify.web.toml'
      - '.github/workflows/shopify-app-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mvqueen-shopify-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck and build Shopify app
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: file:./ci.sqlite
      SHOPIFY_API_KEY: ci-placeholder
      SHOPIFY_API_SECRET: ci-placeholder
      SHOPIFY_APP_URL: https://example.invalid
      SCOPES: read_products,write_products,read_inventory,read_content,write_content,write_metaobjects
      MVQ_WRITE_ENABLED: 'false'
      MVQ_APPROVED_PRODUCT_GIDS: ''
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Validate development Prisma schema
        run: npm run prisma:validate:dev

      - name: Validate production PostgreSQL schema
        env:
          DATABASE_URL: postgresql://mvqueen:ci-placeholder@localhost:5432/mvqueen_ci
          MVQ_DATABASE_PROFILE: production
        run: npm run prisma:validate:production

      - name: Generate Prisma client
        run: npm run prisma:generate:dev

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build
