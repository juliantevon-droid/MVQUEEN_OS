client_id = "56c8090711d1a9f8cfc709b9d5f216d1"
name = "MVQueen OS"
application_url = "https://mvqueen-web-production.up.railway.app"
embedded = true

[build]
automatically_update_urls_on_dev = true
include_config_on_deploy = true

[access_scopes]
scopes = "read_products,write_products,read_inventory,read_orders,read_content,write_content,read_files,write_files,write_metaobjects"

[auth]
redirect_urls = [
  "https://mvqueen-web-production.up.railway.app/auth/callback",
]

[webhooks]
api_version = "2026-07"

[[webhooks.subscriptions]]
topics = ["app/uninstalled"]
uri = "/webhooks/app/uninstalled"

[[webhooks.subscriptions]]
topics = ["app/scopes_update"]
uri = "/webhooks/app/scopes_update"

[[webhooks.subscriptions]]
topics = ["products/create"]
uri = "/webhooks/products/create"

[[webhooks.subscriptions]]
topics = ["products/update"]
uri = "/webhooks/products/update"

[[webhooks.subscriptions]]
compliance_topics = ["customers/data_request"]
uri = "/webhooks/compliance/customers-data-request"

[[webhooks.subscriptions]]
compliance_topics = ["customers/redact"]
uri = "/webhooks/compliance/customers-redact"

[[webhooks.subscriptions]]
compliance_topics = ["shop/redact"]
uri = "/webhooks/compliance/shop-redact"

# Production connection guard:
# The production host, auth callback, and Shopify client ID are linked.
# Never commit the Shopify client secret; keep it only in deployment secrets.
